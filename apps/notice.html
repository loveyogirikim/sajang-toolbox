<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가게 안내문 만들기 — 휴무·이벤트·채용·가격 변경 안내 이미지 | 사장님 업무 도구함</title>
<meta name="description" content="휴무·이벤트·가격 변경·채용·워크숍 안내문을 칸만 채워 휴대폰·인스타·A4 크기 이미지로 만듭니다. 가게 이름·로고·강조 문구·문의까지. 가입 없이 무료.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../style.css?v=18">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<header class="site-head"><a class="brand" href="../">사장님 업무 도구함</a><span class="crumb">가게 안내문 만들기</span></header>
<main id="main" class="wrap print-doc">
  <h1>가게 안내문 만들기</h1>
  <p class="lede">휴무·이벤트·가격 변경·채용 안내를 칸만 채워 카톡·인스타·A4용 이미지로 만들어요. 가게 이름과 로고, 강조 문구, 문의처까지 한 장에.</p>
  <p class="privacy">적은 내용과 로고는 이 기기 안에서만 그려지고 어디에도 보내지 않아요.</p>
  <div class="maker">
    <form id="f-notice" class="form" novalidate>
      <fieldset><legend>무슨 안내인가요? <small>고르면 칸 이름과 예시가 바뀌어요</small></legend><div class="chips" id="templates" role="group"></div></fieldset>
      <label class="field">제목<input name="title" maxlength="40" autocomplete="off"></label>
      <label class="field">한 줄 부제 <small>(선택)</small><input name="sub" maxlength="60" autocomplete="off"></label>
      <fieldset><legend>핵심 정보 <small>왼쪽은 항목 이름, 오른쪽은 내용 — 빈 줄은 빠져요</small></legend>
        <div class="kv" id="rows"></div>
      </fieldset>
      <label class="field">강조할 한 줄 <small>(선택) 눈에 띄는 상자로 들어가요</small><input name="highlight" maxlength="80" autocomplete="off"></label>
      <label class="field">안내 사항 <small>한 줄에 하나씩</small><textarea name="body" rows="5" maxlength="1500"></textarea></label>
      <fieldset><legend>바닥 정보 <small>(선택)</small></legend>
        <div class="row2 full">
          <label class="field">가게·회사 이름<input name="fname" maxlength="40" autocomplete="off"></label>
          <label class="field">문의 <small>전화·카톡</small><input name="fcontact" maxlength="60" autocomplete="off"></label>
        </div>
        <label class="field full">주소<input name="faddress" maxlength="80" autocomplete="off"></label>
        <label class="field full">로고 이미지 <small>(선택) 이 기기에서만 그려요</small><input type="file" name="logo" accept="image/*"></label>
      </fieldset>
      <fieldset><legend>색</legend><div class="chips" id="themes" role="group"></div></fieldset>
      <fieldset><legend>크기</legend><div class="chips" id="sizes" role="group"></div></fieldset>
      <div class="btn-row">
        <button class="btn btn-primary" type="button" id="save">이미지로 저장</button>
        <button class="btn" type="button" id="copy">글로 복사</button>
        <button class="btn" type="button" id="print">인쇄</button>
      </div>
    </form>
    <div class="preview"><canvas id="card" role="img" aria-label="안내문 미리보기" width="1080" height="1440"></canvas></div>
  </div>
</main>
<footer class="foot wrap">
  <p>사장님 업무 도구함 · 계산·안내는 참고용이며 최종 판단은 전문가와 관계 기관에 확인하세요.</p>
</footer>
<script src="../core/notice-core.js?v=18"></script>
<script src="../ui.js?v=18"></script>
<script src="notice.js?v=18"></script>
<script src="../park-annotate.js?v=18" data-factory="sajang-toolbox" defer></script>
</body>
</html>
